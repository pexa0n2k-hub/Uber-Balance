<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101419"><meta name="description" content="Corte diario de ingresos y gastos de Uber"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Uber Balance</title><style>
:root{color-scheme:dark;--bg:#0c1015;--line:#ffffff19;--text:#f4f7fa;--muted:#9daab7;--green:#68e6a4;--red:#ff8f85}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#1c332d 0,transparent 42%),radial-gradient(ellipse at 100% 20%,#202b40 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif;min-height:100vh}.app{max-width:780px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px 110px}header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.15em;font-weight:800}.brand{font-weight:850;font-size:24px}.brand span{color:var(--green)}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}h1{font-size:27px;line-height:1.12;margin:8px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.card{background:linear-gradient(145deg,#ffffff16,#ffffff06);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 16px 42px #0003;backdrop-filter:blur(18px);margin:12px 0}.hero{background:linear-gradient(135deg,#2a57439e,#182726b3)}.money{font-size:clamp(31px,8vw,42px);font-weight:850;color:var(--green);margin:5px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border-radius:17px;background:#ffffff08;border:1px solid #ffffff0b}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:20px;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.btn{border:0;border-radius:15px;padding:13px 15px;font:inherit;font-weight:750;cursor:pointer;color:#08140e;background:var(--green);width:100%;min-height:46px;margin-top:12px}.btn.secondary{color:var(--text);background:#ffffff0b;border:1px solid var(--line)}.btn:disabled{opacity:.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:#c3cdd7;font-size:12px;font-weight:700;margin:12px 0 6px}input{display:block;width:100%;border:1px solid #ffffff20;border-radius:13px;background:#0c1117;color:var(--text);font:inherit;padding:12px;min-height:45px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:15px;background:#ffffff05}.empty{padding:18px;text-align:center;color:var(--muted)}.record{min-width:0;flex:1}.record-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.mini{border:1px solid var(--line);border-radius:9px;background:#ffffff0b;color:var(--text);font:700 11px system-ui;padding:6px 9px}.mini.danger{color:var(--red);border-color:#ff8f8540}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 7px calc(9px + env(safe-area-inset-bottom));background:#101419e8;border-top:1px solid var(--line);backdrop-filter:blur(22px);display:flex;gap:3px}nav button{background:transparent;color:var(--muted);border:0;border-radius:12px;padding:9px 4px;font:700 10px system-ui;flex:1}nav button.active{background:#68e6a419;color:var(--green)}nav .ico{font-size:17px;display:block;margin-bottom:3px}.notice{padding:11px 13px;border-radius:14px;background:#ffd27a12;border:1px solid #ffd27a30;color:#ffe3a9;font-size:12px;margin:10px 0}.notice.error{background:#ff8f8514;border-color:#ff8f8580;color:#ffb7b0}@media(min-width:600px){.app{padding-left:22px;padding-right:22px}}</style></head><body><div class="app"><header><div><div class="eyebrow">CORTE DIARIO DE INGRESOS</div><div class="brand">UBER <span>BALANCE</span></div></div><div class="pill">● Guardado local</div></header><main id="app"><div class="card">Cargando Uber Balance…</div></main></div><nav><button class="active" data-tab="home"><span class="ico">◈</span>Inicio</button><button data-tab="route"><span class="ico">🏁</span>Final ruta</button><button data-tab="expense"><span class="ico">↘</span>Gastos</button><button data-tab="fuel"><span class="ico">⛽</span>Gasolina</button><button data-tab="history"><span class="ico">▤</span>Historial</button></nav><script src="./app.js?v=corte1"></script></body></html>
